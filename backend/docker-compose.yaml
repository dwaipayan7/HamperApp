services:
  backend:
    build: .
    container_name: hamperapp-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - valkey
      - elasticsearch 
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: hamperapp-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: hamperapp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m 
    ports:
      - "9200:9200"
    restart: unless-stopped
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: hamperapp-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601" 
    restart: unless-stopped
    depends_on:
      - elasticsearch 

volumes:
  valkey-data:
  es-data: